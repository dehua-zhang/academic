<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人学术主页</title>
<meta name="description" content="个人学术主页">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14563f">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314563f'/%3E%3Cpath d='M19 45V19l13 15 13-15v26' fill='none' stroke='%23fbfaf7' stroke-width='4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
<script>
/* 在样式生效前决定明暗模式，避免首屏闪白 */
(function () {
  try {
    var saved = localStorage.getItem("color-mode");
    var mode = (saved === "dark" || saved === "light")
      ? saved
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-color-mode", mode);
  } catch (e) {}
})();
</script>
<script src="assets/app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main-content">跳到正文</a>

<noscript>
  <p class="noscript-note">本页内容由 JavaScript 从 content.json 渲染，请启用 JavaScript 后刷新页面。</p>
</noscript>

<div id="progress" aria-hidden="true"></div>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#main-content">
      <span class="brand-mark" data-brand-mark aria-hidden="true"></span>
      <span class="brand-text">
        <b data-brand-name></b>
        <em data-brand-en></em>
      </span>
    </a>
    <div class="nav-wrap">
      <nav class="nav" id="nav" aria-label="页面导航"></nav>
    </div>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换深色模式" aria-pressed="false" title="切换深色 / 浅色模式">
      <svg class="i-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>

<main id="main-content">
  <section class="hero" style="border-top:0"><div class="wrap hero-grid" data-render="hero"></div></section>
  <section id="research" aria-labelledby="h-research"><div class="wrap" data-render="research"></div></section>
  <section id="experience" aria-labelledby="h-experience"><div class="wrap" data-render="experience"></div></section>
  <section id="news" aria-labelledby="h-news"><div class="wrap" data-render="news"></div></section>
  <section id="highlights" aria-labelledby="h-highlights"><div class="wrap" data-render="highlights"></div></section>
  <section id="publications" aria-labelledby="h-publications"><div class="wrap" data-render="publications"></div></section>
  <section id="join" aria-labelledby="h-join"><div class="wrap" data-render="join"></div></section>
  <section id="contact" aria-labelledby="h-contact"><div class="wrap" data-render="contact"></div></section>
</main>

<footer><div class="wrap foot" data-render="footer"></div></footer>

<div id="jsonAlert" class="json-alert" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<button id="toTop" aria-label="返回顶部">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
</button>
</body>
</html>
